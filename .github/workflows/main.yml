name: Build Madrasati APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: |
          unzip MadrasatiAndroid-v1.zip || unzip MadrasatiAndroid*.zip
          mv MadrasatiAndroid-v1/* . 2>/dev/null || true
          mv MadrasatiAndroid-v1/.* . 2>/dev/null || true
          rm -rf MadrasatiAndroid-v1
          rm -f MadrasatiAndroid-v1.zip
          ls -la
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Madrasati-APK
          path: app/build/outputs/apk/debug/app-debug.apk
