name: Build Madrasati APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: |
          ZIP=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          unzip -o "$ZIP"
          rm -f "$ZIP"
          PROJECT_DIR=$(find . -name "settings.gradle*" | head -n 1 | xargs dirname)
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          echo "Project: $PROJECT_DIR"
          ls "$PROJECT_DIR/app/"
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Fix Java 1.8 -> 17
        run: |
          cd "$PROJECT_DIR"
          rm -f ~/.gradle/init.gradle
          # Badilisha kila file
          find . -name "build.gradle" -o -name "build.gradle.kts" | while read f; do
            echo "Fixing $f"
            sed -i 's/VERSION_1_8/VERSION_17/g' "$f"
            sed -i 's/VERSION_1_7/VERSION_17/g' "$f"
            sed -i 's/JavaVersion.VERSION_1_8/JavaVersion.VERSION_17/g' "$f"
            sed -i 's/jvmTarget = "1.8"/jvmTarget = "17"/g' "$f"
            sed -i 's/jvmTarget = "11"/jvmTarget = "17"/g' "$f"
            sed -i 's/"1.8"/"17"/g' "$f"
            sed -i "s/'1.8'/'17'/g" "$f"
          done
          # Ongeza toolchain kama haipo
          grep -q "jvmToolchain" app/build.gradle.kts || echo '    kotlin { jvmToolchain(17) }' >> app/build.gradle.kts || true
          cat app/build.gradle.kts
      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          gradle assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Madrasati-APK
          path: |
            **/app/build/outputs/apk/debug/*.apk
