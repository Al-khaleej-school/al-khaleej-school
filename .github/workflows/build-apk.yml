name: Build Madrasati APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: |
          ZIP=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          unzip -o "$ZIP"
          rm -f "$ZIP"
          PROJECT_DIR=$(find . -name "settings.gradle*" | head -n 1 | xargs dirname)
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          echo "Found: $PROJECT_DIR"
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Fix JVM Target Mismatch
        run: |
          cd "$PROJECT_DIR"
          # Badilisha 1_8 kuwa 17 kila mahali
          sed -i 's/VERSION_1_8/VERSION_17/g' app/build.gradle.kts || true
          sed -i 's/VERSION_1_8/VERSION_17/g' app/build.gradle || true
          sed -i 's/jvmTarget = "1.8"/jvmTarget = "17"/g' app/build.gradle.kts || true
          sed -i 's/jvmTarget = "1.8"/jvmTarget = "17"/g' app/build.gradle || true
          sed -i 's/"1.8"/"17"/g' app/build.gradle.kts || true
          cat app/build.gradle.kts | grep -A2 -B2 jvmTarget || true
      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          gradle assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Madrasati-APK
          path: |
            **/app/build/outputs/apk/debug/*.apk
