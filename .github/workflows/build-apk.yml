name: Build Madrasati APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: |
          unzip -o MadrasatiAndroid-v1.zip
          rm -rf MadrasatiAndroid-v1.zip
          ls -R | head -n 100
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build APK
        run: |
          GRADLEW=$(find . -name gradlew -type f | head -n 1)
          echo "Found gradlew at $GRADLEW"
          if [ -z "$GRADLEW" ]; then echo "gradlew hakuna"; exit 1; fi
          DIR=$(dirname "$GRADLEW")
          cd "$DIR"
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Madrasati-APK
          path: |
            **/app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/*.apk
