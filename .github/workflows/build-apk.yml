name: Build Madrasati APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: |
          ZIP=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          unzip -o "$ZIP"
          rm -f "$ZIP"
          PROJECT_DIR=$(find . -name "settings.gradle*" | head -n 1 | xargs dirname)
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Force Java 17 for all
        run: |
          cd "$PROJECT_DIR"
          # Badilisha kila mahali 1.8 -> 17
          find . -name "build.gradle*" -exec sed -i 's/VERSION_1_8/VERSION_17/g; s/1.8/17/g; s/JAVA_1_8/JAVA_17/g' {} \;
          # Tengeneza file inayolazimisha gradle kutumia 17
          mkdir -p ~/.gradle
          cat > ~/.gradle/init.gradle << 'EOF'
          allprojects {
            tasks.withType(JavaCompile).configureEach {
                sourceCompatibility = "17"
                targetCompatibility = "17"
            }
            tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
                kotlinOptions.jvmTarget = "17"
            }
          }
          EOF
          cat ~/.gradle/init.gradle
      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          gradle assembleDebug --stacktrace --warning-mode all
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Madrasati-APK
          path: |
            **/app/build/outputs/apk/debug/*.apk
